<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorenz Attractor Chaos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg: #0d0d0d; --ink: #f0ece4; --accent: #e8c14a; --muted: #5a5548; --card-bg: #161612; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: 'DM Mono', monospace; display: flex; overflow: hidden; }
    .controls { width: 320px; height: 100%; background: var(--card-bg); border-right: 1px solid var(--muted); padding: 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; z-index: 2; overflow-y: auto; }
    h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin: 0; color: var(--accent); }
    p { font-size: 0.72rem; color: var(--muted); line-height: 1.5; margin: 0; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink); }
    input[type="range"] { -webkit-appearance: none; appearance: none; background: var(--muted); height: 2px; outline: none; margin: 8px 0; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; background: var(--accent); cursor: pointer; border-radius: 50%; }
    .action-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px; font-family: 'DM Mono', monospace; font-size: 0.7rem; text-transform: uppercase; cursor: pointer; transition: all 0.2s; margin-top: auto; }
    .action-btn:hover { background: var(--accent); color: var(--bg); }
    .canvas-container { flex-grow: 1; height: 100%; position: relative; background: #090909; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    canvas { background: #020202; border: 1px solid rgba(90, 85, 72, 0.3); max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>
  <div class="controls">
    <h3>Lorenz Chaos</h3>
    <p>Plot deterministic chaos structures. Modify classic equations variables ($\sigma, \rho, \beta$) live.</p>
    <div class="control-group">
      <label>Sigma (&sigma;): <span id="sig-val">10</span></label>
      <input type="range" id="sigma" min="1" max="20" step="0.1" value="10">
    </div>
    <div class="control-group">
      <label>Rho (&rho;): <span id="rho-val">28</span></label>
      <input type="range" id="rho" min="10" max="50" step="0.5" value="28">
    </div>
    <div class="control-group">
      <label>Beta (&beta;): <span id="beta-val">2.66</span></label>
      <input type="range" id="beta" min="1" max="5" step="0.01" value="2.66">
    </div>
    <button class="action-btn" onclick="resetChaos()">Reset Vector Traces</button>
  </div>
  <div class="canvas-container"><canvas id="chaosCanvas" width="700" height="700"></canvas></div>

  <script>
    const canvas = document.getElementById('chaosCanvas');
    const ctx = canvas.getContext('2d');
    
    let x, y, z;
    let points = [];
    const dt = 0.01;

    function resetChaos() {
      x = 0.01; y = 0; z = 0;
      points = [];
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }

    function loop() {
      const sigma = parseFloat(document.getElementById('sigma').value);
      const rho = parseFloat(document.getElementById('rho').value);
      const beta = parseFloat(document.getElementById('beta').value);
      
      document.getElementById('sig-val').innerText = sigma;
      document.getElementById('rho-val').innerText = rho;
      document.getElementById('beta-val').innerText = beta;

      // Standard differential calculations mapping equations
      let dx = (sigma * (y - x)) * dt;
      let dy = (x * (rho - z) - y) * dt;
      let dz = (x * y - beta * z) * dt;
      x += dx; y += dy; z += dz;

      points.push({x, y, z});
      if(points.length > 2500) points.shift();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Render tracking line history paths
      if(points.length > 1) {
        ctx.beginPath();
        // Translate coordinates cleanly to center fit within the canvas projection viewport
        ctx.moveTo(canvas.width/2 + points[0].x * 12, canvas.height/2 + points[0].y * 12);
        for(let i=1; i<points.length; i++) {
          ctx.lineTo(canvas.width/2 + points[i].x * 12, canvas.height/2 + points[i].y * 12);
        }
        ctx.strokeStyle = '#e8c14a'; ctx.lineWidth = 1; ctx.stroke();
      }
      requestAnimationFrame(loop);
    }
    resetChaos(); loop();
  </script>
</body>
</html>
