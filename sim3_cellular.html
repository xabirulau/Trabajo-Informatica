<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0d;
      --ink: #f0ece4;
      --accent: #e8c14a;
      --muted: #5a5548;
      --card-bg: #161612;
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: 'DM Mono', monospace;
      display: flex; overflow: hidden;
    }
    
    /* Controls Panel */
    .controls {
      width: 320px; height: 100%; background: var(--card-bg);
      border-right: 1px solid var(--muted); padding: 30px 20px;
      box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;
      z-index: 2; overflow-y: auto;
    }
    h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin: 0 0 5px 0; color: var(--accent); }
    p { font-size: 0.72rem; color: var(--muted); line-height: 1.5; margin: 0 0 10px 0; }
    
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink); }
    
    /* Ranges & Selects */
    input[type="range"] {
      -webkit-appearance: none; appearance: none; background: var(--muted);
      height: 2px; outline: none; margin: 8px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 10px; height: 10px;
      background: var(--accent); cursor: pointer; border-radius: 50%;
    }
    select {
      background: var(--bg); color: var(--ink); border: 1px solid var(--muted);
      padding: 6px; font-family: 'DM Mono', monospace; font-size: 0.75rem; outline: none;
    }
    select:focus { border-color: var(--accent); }

    /* Custom Checkbox for Wrap Mode */
    .checkbox-container {
      display: flex; align-items: center; gap: 10px; margin: 5px 0; cursor: pointer; user-select: none;
    }
    .checkbox-container input { display: none; }
    .checkmark {
      width: 14px; height: 14px; border: 1px solid var(--muted); display: inline-block; position: relative;
    }
    .checkbox-container input:checked + .checkmark { border-color: var(--accent); background: rgba(232,193,74,0.1); }
    .checkbox-container input:checked + .checkmark::after {
      content: ''; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px;
      border: solid var(--accent); border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    .checkbox-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Button Groupings */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
    .action-btn {
      background: transparent; border: 1px solid var(--muted); color: var(--ink);
      padding: 10px; font-family: 'DM Mono', monospace; font-size: 0.7rem;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.primary { border-color: var(--accent); color: var(--accent); }
    .action-btn.primary:hover { background: var(--accent); color: var(--bg); }

    /* Canvas Area */
    .canvas-container {
      flex-grow: 1; height: 100%; position: relative;
      background: #090909; display: flex; align-items: center; justify-content: center;
      padding: 20px; box-sizing: border-box;
    }
    canvas {
      background: #020202;
      border: 1px solid rgba(90, 85, 72, 0.3);
      cursor: crosshair;
      max-width: 100%; max-height: 100%;
    }
  </style>
</head>
<body>

  <div class="controls">
    <h3>Automata Core</h3>
    <p>Conway's Game of Life ruleset engine. Click or drag directly on the matrix workspace to manually sketch initial cellular constructs.</p>
    
    <div class="control-group">
      <label>Step Interval: <span id="speed-val">100</span>ms</label>
      <input type="range" id="speed" min="30" max="1000" step="10" value="100">
    </div>

    <div class="control-group">
      <label>Matrix Resolution</label>
      <select id="grid-size" onchange="changeResolution()">
        <option value="30">30 × 30 (Macro Structural)</option>
        <option value="50" selected>50 × 50 (Standard Balance)</option>
        <option value="80">80 × 80 (High Density Grid)</option>
        <option value="120">120 × 120 (Micro Complex)</option>
      </select>
    </div>

    <label class="checkbox-container">
      <input type="checkbox" id="grid-wrap" checked>
      <span class="checkmark"></span>
      <span class="checkbox-label">Enable Toroidal Wrapping</span>
    </label>

    <div class="btn-row">
      <button class="action-btn primary" id="run-btn" onclick="togglePlayback()">Run Engine</button>
      <button class="action-btn" onclick="stepGeneration()">Manual Step</button>
    </div>

    <div class="btn-row">
      <button class="action-btn" onclick="seedRandom()">Random Seed</button>
      <button class="action-btn" onclick="clearMatrix()">Clear Matrix</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="lifeCanvas" width="700" height="700"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('lifeCanvas');
    const ctx = canvas.getContext('2d');

    let resolution = 50; 
    let rows = resolution;
    let cols = resolution;
    let grid = createGrid();
    let isRunning = false;
    let animationTimeout = null;
    let isDrawing = false;

    // Build functional multidimensional arrays
    function createGrid() {
      return Array.from({ length: rows }, () => Array(cols).fill(0));
    }

    // Adapt sizing logic on change input selector updates
    function changeResolution() {
      const select = document.getElementById('grid-size');
      resolution = parseInt(select.value);
      rows = resolution;
      cols = resolution;
      clearMatrix();
    }

    function clearMatrix() {
      stopEngine();
      grid = createGrid();
      renderGrid();
    }

    function seedRandom() {
      grid = Array.from({ length: rows }, () => 
        Array.from({ length: cols }, () => Math.random() > 0.75 ? 1 : 0)
      );
      renderGrid();
    }

    function renderGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cellWidth = canvas.width / cols;
      const cellHeight = canvas.height / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] === 1) {
            ctx.fillStyle = '#e8c14a'; // --accent
            ctx.fillRect(c * cellWidth, r * cellHeight, cellWidth - 0.7, cellHeight - 0.7);
          } else {
            // Soft grid mesh tracking guidelines
            ctx.strokeStyle = 'rgba(90, 85, 72, 0.08)';
            ctx.strokeRect(c * cellWidth, r * cellHeight, cellWidth, cellHeight);
          }
        }
      }
    }

    // The Algorithmic State Transformer Loop
    function computeNextGeneration() {
      const nextGrid = createGrid();
      const wrapEnabled = document.getElementById('grid-wrap').checked;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let liveNeighbors = 0;

          // Compute neighbor counts across adjacent vectors
          for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
              if (i === 0 && j === 0) continue;

              let targetR = r + i;
              let targetC = c + j;

              if (wrapEnabled) {
                // Modulo mechanics enabling seamless grid wrap calculations
                targetR = (targetR + rows) % rows;
                targetC = (targetC + cols) % cols;
                if (grid[targetR][targetC] === 1) liveNeighbors++;
              } else {
                // Hard wall system boundaries check
                if (targetR >= 0 && targetR < rows && targetC >= 0 && targetC < cols) {
                  if (grid[targetR][targetC] === 1) liveNeighbors++;
                }
              }
            }
          }

          // Game of Life Standard Conway State Ruleset Application
          const currentCell = grid[r][c];
          if (currentCell === 1 && (liveNeighbors < 2 || liveNeighbors > 3)) {
            nextGrid[r][c] = 0; // Death via under/overpopulation
          } else if (currentCell === 0 && liveNeighbors === 3) {
            nextGrid[r][c] = 1; // Birth via reproduction
          } else {
            nextGrid[r][c] = currentCell; // Stasis
          }
        }
      }

      grid = nextGrid;
      renderGrid();
    }

    // Continuous Frame Progression Loop Controls
    function playLoop() {
      if (!isRunning) return;
      computeNextGeneration();
      const interval = parseInt(document.getElementById('speed').value);
      document.getElementById('speed-val').innerText = interval;
      animationTimeout = setTimeout(playLoop, interval);
    }

    function togglePlayback() {
      if (isRunning) {
        stopEngine();
      } else {
        isRunning = true;
        document.getElementById('run-btn').innerText = "Halt Engine";
        document.getElementById('run-btn').classList.remove('primary');
        playLoop();
      }
    }

    function stopEngine() {
      isRunning = false;
      clearTimeout(animationTimeout);
      document.getElementById('run-btn').innerText = "Run Engine";
      document.getElementById('run-btn').classList.add('primary');
    }

    function stepGeneration() {
      stopEngine();
      computeNextGeneration();
    }

    // Mouse Vector Mapping Coordinate Handlers for custom grid edits
    function handleDrawInteraction(e) {
      const rect = canvas.getBoundingClientRect();
      // Calculate normalized interaction scalars
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;

      const c = Math.floor(mouseX / (canvas.width / cols));
      const r = Math.floor(mouseY / (canvas.height / rows));

      if (r >= 0 && r < rows && c >= 0 && c < cols) {
        grid[r][c] = e.shiftKey ? 0 : 1; // Shift + Draw acts as eraser mechanism
        renderGrid();
      }
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; handleDrawInteraction(e); });
    canvas.addEventListener('mousemove', (e) => { if (isDrawing) handleDrawInteraction(e); });
    window.addEventListener('mouseup', () => isDrawing = false);

    // Dynamic label bindings updates for sliders
    document.getElementById('speed').addEventListener('input', (e) => {
      document.getElementById('speed-val').innerText = e.target.value;
    });

    // Default Initialization Vector
    seedRandom();
  </script>
</body>
</html>
