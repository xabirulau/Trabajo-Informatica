<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosystem Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg: #0d0d0d; --ink: #f0ece4; --accent: #e8c14a; --muted: #5a5548; --card-bg: #161612; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: 'DM Mono', monospace; display: flex; overflow: hidden; }
    .controls { width: 320px; height: 100%; background: var(--card-bg); border-right: 1px solid var(--muted); padding: 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; z-index: 2; overflow-y: auto; }
    h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin: 0; color: var(--accent); }
    p { font-size: 0.72rem; color: var(--muted); line-height: 1.5; margin: 0; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink); }
    input[type="range"] { -webkit-appearance: none; appearance: none; background: var(--muted); height: 2px; outline: none; margin: 8px 0; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; background: var(--accent); cursor: pointer; border-radius: 50%; }
    .action-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px; font-family: 'DM Mono', monospace; font-size: 0.7rem; text-transform: uppercase; cursor: pointer; transition: all 0.2s; margin-top: auto; }
    .action-btn:hover { background: var(--accent); color: var(--bg); }
    .canvas-container { flex-grow: 1; height: 100%; position: relative; background: #090909; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    canvas { background: #020202; border: 1px solid rgba(90, 85, 72, 0.3); max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>
  <div class="controls">
    <h3>Eco Matrix</h3>
    <p>Simulate population limits. Watch gold nodes (Predators) hunt muted matrix entities (Prey).</p>
    <div class="control-group">
      <label>Prey Growth Rate: <span id="prey-val">4</span></label>
      <input type="range" id="prey-speed" min="1" max="10" value="4">
    </div>
    <div class="control-group">
      <label>Predator Efficiency: <span id="pred-val">50</span>%</label>
      <input type="range" id="pred-kill" min="10" max="90" value="50">
    </div>
    <button class="action-btn" onclick="initEcosystem()">Re-Seed Matrix Population</button>
  </div>
  <div class="canvas-container"><canvas id="ecoCanvas" width="700" height="700"></canvas></div>

  <script>
    const canvas = document.getElementById('ecoCanvas');
    const ctx = canvas.getContext('2d');
    let agents = [];

    function initEcosystem() {
      agents = [];
      // Populate baseline structural quantities of organisms
      for(let i=0; i<180; i++) agents.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, type: 'prey', energy: 10 });
      for(let i=0; i<15; i++) agents.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, type: 'predator', energy: 30 });
    }

    function loop() {
      ctx.fillStyle = 'rgba(2,2,2,0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const preySpeed = parseFloat(document.getElementById('prey-speed').value) * 0.3;
      const killChance = parseFloat(document.getElementById('pred-kill').value) / 100;
      document.getElementById('prey-val').innerText = document.getElementById('prey-speed').value;
      document.getElementById('pred-val').innerText = document.getElementById('pred-kill').value;

      // Handle agent state loops
      agents.forEach((a, index) => {
        a.x += (Math.random() - 0.5) * 4;
        a.y += (Math.random() - 0.5) * 4;
        
        // Edge containment constraints
        if(a.x < 0) a.x = canvas.width; else if(a.x > canvas.width) a.x = 0;
        if(a.y < 0) a.y = canvas.height; else if(a.y > canvas.height) a.y = 0;

        if(a.type === 'prey') {
          ctx.fillStyle = 'rgba(240, 236, 228, 0.4)';
          ctx.fillRect(a.x, a.y, 3, 3);
          
          // Micro asexual division ruleset
          if(Math.random() < 0.005 * preySpeed && agents.length < 400) {
            agents.push({x: a.x, y: a.y, type: 'prey', energy: 10});
          }
        } else {
          a.energy -= 0.15; // Predator base metabolism drain
          ctx.fillStyle = '#e8c14a';
          ctx.fillRect(a.x - 2, a.y - 2, 6, 6);

          // Find surrounding target entities to absorb energy
          agents.forEach((other, oIndex) => {
            if(other.type === 'prey') {
              let dist = Math.hypot(a.x - other.x, a.y - other.y);
              if(dist < 8 && Math.random() < killChance) {
                agents.splice(oIndex, 1);
                a.energy += 12;
              }
            }
          });

          // Death check or division replication
          if(a.energy <= 0) {
            agents.splice(index, 1);
          } else if(a.energy > 60) {
            a.energy = 30;
            agents.push({x: a.x, y: a.y, type: 'predator', energy: 30});
          }
        }
      });

      requestAnimationFrame(loop);
    }
    initEcosystem(); loop();
  </script>
</body>
</html>
